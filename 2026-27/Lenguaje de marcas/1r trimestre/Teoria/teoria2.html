<!DOCTYPE html>
<html>
	<head>
		<title>Usos de head</title>
		
		<!-- Etiquetas meta ------------------------------------------------------------------------------------------------ -->
		<meta charset="UTF-8"> <!-- aplica codificación UTF8 y nos ahorra usar algunas entidades como &aacute; -->
		<meta name="author" content="Juan José Moreno Díaz">
		<meta name="description" content="Esto es la descripción que usan los buscadores"> <!-- info para SEO -->
		<meta name="keywords" content="html, css, js, web"> <!-- palabras clave para buscadores -->
		<meta name="robots" content="noindex, nofollow"> <!-- le dice a los buscadores que no indexe la página y no siga los enlaces-->
		<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- para mejorar la visualización en móviles -->
		<meta http-equiv="refresh" content="10;https://www.wikipedia.org"> <!-- si no ponemos url se recarga la misma página -->
		
		<!-- Aplicar  estilos ---------------------------------------------------------------------------------------------- -->
		
		<!-- Fuentes de texto externas -->
		<link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
		
		<!-- Estilo en el propio fichero -->
		<style>
			p { 
				border: solid red 3px;
				font-family: 'Lobster', cursive;
			}
		</style>
		
		<!-- Estilos almacenados en otro fichero -->
		<link rel="stylesheet" href="estilos_externos.css"> 
		
		
		<!-- Definir funciones de Javascript ----------------------------------------------------------------------------- -->
		
		<!-- OJO: mejor ponerlo al final del documento html -->
		<script type="text/javascript">
			alert("Hola! Esto es una alerta de Javascript");
		</script>
		
		<!-- js almacenado en otro fichero -->
		<script src="funciones_externas.js"></script> 
		
		<!-- Icono de la ventana -->
		<link rel="icon" type="image/png" href="favicon.png">
	</head>
	<body>
		<br><br><br>
		<p>
			Me voy a recargar en 10 segundos
		</p>
	</body>
</html>
