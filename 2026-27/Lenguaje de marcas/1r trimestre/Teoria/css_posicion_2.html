<!DOCTYPE html>
<html lang="en">
<head>
    <title>Posicionamiento 2 - Sin comentar</title>
    <style>
        body {
            position: relative;
            margin: 0px;
            min-height: 100vh;
            width: 100vw;
            background-color: silver;
        }
        div {
            position: relative;
            width: 30%;
            height: 100px;
            border: 3px solid black;
            background-color: silver;
            font-size: 75px;
            text-align: center;
            margin: 5px;
            padding: 5px;
            box-sizing: border-box;
        }
        #padre {
            position: absolute;
            margin: auto;
            background-color: orange;
            border: 3px solid black;
            width: 800px;
            height: 500px;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
        }
        #d1 {
            font-style: italic;
        }
        #d2 {
            font-weight: bold;
            float: right;
        }
        #d3 {
            text-decoration: underline;
            float: right;
        }
    </style>
</head>
<body>
    <div id="padre">
        <div id="d1">1</div>
        <div id="d2">2</div>
        <div id="d3">3</div>
    </div>
</body>
</html>
