<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Paginita DIVS</title>
    <style>
        * {
            box-sizing: border-box;
        }
        div {
            border: black solid 3px;
            height: 100px;
        }
        #caja1 {
            background-color: silver;
        }
        #caja2 {
            background-color: yellow;
            position: relative;
            float: right;
            width: 70%;
        }
        #caja3 {
            background-color: cyan;
            position: relative;
            width: 30%;
        }
        #caja4 {
            background-color: rosybrown;
        }
        #loquesea {
            border: solid red 2px;
        }
    </style>
</head>
<body>
    <h1>Ejemplo de DIVS</h1>
    <div id="caja1"><span id="loquesea">Soy la caja 1</span></div>
    <div id="caja2">Soy la caja 2</div>
    <div id="caja3">Soy la caja 3</div>
    <div id="caja4">Soy la caja 4</div>
</body>
</html>
