<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <img src="Súper ofertas en sofás@1x.png" alt="" width="250px">
    <form action="receptor.html">
        <fieldset>
            <fieldset>
                <label for="modelos">Modelos:</label><br>
                <label for="Everest">Everest</label>
                <input type="radio" name="modelos" id="Everest"><br>
                <label for="Kilimanjaro">Kilimanjaro</label>
                <input type="radio" name="modelos" id="Kilimanjaro"><br>
                <label for="Aneto">Aneto</label>
                <input type="radio" name="modelos" id="Aneto"><br>
            </fieldset>
            <fieldset>
                <label for="medidas">Medidas:</label><br>
                <label for="2,40">2,40</label>
                <input type="radio" name="medidas" id="2,40"><br>
                <label for="2,60">2,60</label>
                <input type="radio" name="medidas" id="2,60"><br>
                <label for="2,80">2,80</label>
                <input type="radio" name="medidas" id="2,80"><br>
                <label for="3,00">3,00</label>
                <input type="radio" name="medidas" id="3,00"><br>
            </fieldset>
            <fieldset>
                <label for="chaiselong">Chaiselong:</label><br>
                <label for="no">No</label>
                <input type="radio" name="chaiselong" id="no"><br>
                <label for="Aladerecha">A la derecha</label>
                <input type="radio" name="chaiselong" id="Aladerecha"><br>
                <label for="Alaizquierda">A la izquierda</label>
                <input type="radio" name="chaiselong" id="Alaizquierda"><br>
            </fieldset>
            <fieldset>
                <label for="color">Color:</label><br>
                <input type="color" name="color" id="color">
            </fieldset>
            <fieldset>
                <label for="opciones">Opciones:</label><br>
                <label for="antimanchas">Antimanchas</label>
                <input type="checkbox" name="antimanchas" id="antimanchas"><br>
                <label for="antianimales">A prueba de animales</label>
                <input type="checkbox" name="antianimales" id="antianimales"><br>
                <label for="electrificado">Electrificado</label>
                <input type="checkbox" name="electrificado" id="electrificado"><br>
                <label for="bagul">Bagul</label>
                <input type="checkbox" name="bagul" id="bagul"><br>
            </fieldset>
            <button type="reset">Reinicia</button>
            <button type="submit"><a href="receptor.html" target="iframe1">Envio Urgente</a></button>
        </fieldset>
    </form>
    <iframe src="" name='iframe1' frameborder="0" width="75%" height="500px"></iframe>
</body>
</html>
