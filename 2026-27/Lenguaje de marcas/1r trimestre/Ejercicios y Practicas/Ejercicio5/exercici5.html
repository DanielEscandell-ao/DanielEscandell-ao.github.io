<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuadrados</title>
    <style>
        body {
            position: relative;
            margin: 0px;
            min-height: 100vh;
            width: 100vw;
            background-color: silver;
        }
        div {
            position: absolute;
            border: 3px solid black;
            margin: auto;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
        }
        #padre {
            position: absolute;
            margin: auto;
            background-color: orange;
            border: 3px solid black;
            width: 500px;
            height: 500px;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
        }
        #d1 {
            width: 400px;
            height: 400px;
            background-color: red;
        }
        #d2 {
            width: 300px;
            height: 300px;
            background-color: green;
        }
        #d3 {
            width: 200px;
            height: 200px;
            background-color: wheat;
        }
        #d4 {
            width: 100px;
            height: 100px;
            background-color: white;
        }
    </style>
</head>
<body>
    <div id="padre">
        <div id="d1">
            <div id="d2">
                <div id="d3">
                    <div id="d4">
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
